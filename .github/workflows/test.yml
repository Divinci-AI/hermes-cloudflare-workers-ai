name: tests

# The suite imports Hermes from a checkout and calls some of its private APIs (auth registry, runtime
# provider resolution), so it is run against two Hermes revisions:
#   pin  - the commit this plugin is released against. A failure here blocks.
#   main - the moving head. A failure here is the early warning that Hermes changed something the plugin
#          relies on; it is reported but does not block (continue-on-error), and the weekly run keeps
#          the signal fresh when nobody is pushing.
# To move the pin: change the `pin` ref below, run the suite locally against it, and update the README.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: hermes ${{ matrix.name }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow-failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: pin
            ref: fdec926ef54391edcf6caad5f7f6761fdcccdaa2
            allow-failure: false
          - name: main
            ref: main
            allow-failure: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.ref }}
          path: hermes-agent
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Show which Hermes revision is under test
        run: git -C hermes-agent log -1 --format='hermes-agent %H %ci'

      - name: Run the suite
        env:
          HERMES_AGENT_DIR: ${{ github.workspace }}/hermes-agent
        run: python -m pytest tests -q -p no:cacheprovider
